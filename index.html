<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#28262a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>decastro.dev | João Gabriel Duarte</title>
    <!-- Loading screen styles live here so it shows before the site's own CSS and JS arrive -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #28262a;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #boot.boot-done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        display: grid;
        justify-items: center;
        gap: 1.4rem;
      }
      .boot-logo {
        font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        font-weight: 300;
        font-size: clamp(2rem, 8vw, 3.6rem);
        letter-spacing: -0.01em;
        color: #fff;
        white-space: nowrap;
      }
      .boot-logo span {
        display: inline-block;
        animation: boot-hop 1.6s ease-in-out infinite;
        animation-delay: calc(var(--i) * 70ms);
      }
      .boot-logo .g {
        color: #4caf50;
      }
      .boot-logo .b {
        animation: none;
        margin: 0 0.12em;
      }
      .boot-logo .s {
        animation: none;
        transform: scaleY(1.45);
      }
      .boot-bar {
        width: 9rem;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #4caf50;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-hop {
        0%, 50%, 100% { transform: none; }
        20% { transform: translateY(-0.25em); }
      }
      @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo span, .boot-bar::after { animation: none; }
      }
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <!-- Removed by the app once the 3D room has drawn its first frame (src/lib/boot.ts) -->
    <div id="boot" role="status">
      <div class="boot-inner" aria-hidden="true">
        <div class="boot-logo"><span class="b">&lt;</span><span style="--i: 0">d</span><span style="--i: 1">e</span><span style="--i: 2">c</span><span style="--i: 3">a</span><span style="--i: 4">s</span><span style="--i: 5">t</span><span style="--i: 6">r</span><span style="--i: 7">o</span><span class="g" style="--i: 8">.</span><span class="g" style="--i: 9">d</span><span class="g" style="--i: 10">e</span><span class="g" style="--i: 11">v</span><span class="b s">/</span><span class="b">&gt;</span></div>
        <div class="boot-bar"></div>
      </div>
      <span class="boot-sr">Carregando decastro.dev</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
